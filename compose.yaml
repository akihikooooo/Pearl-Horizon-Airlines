services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pearl-cloudflared
    command: tunnel run pearl-horizon
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 64m

  nginx:
    container_name: pearl-nginx
    volumes:
      - pearlfrontend:/app:ro
    build:
      context: ./nginx
      dockerfile: Dockerfile
    cpus: "0.5"
    mem_limit: 64m

  # frontend-builder:
