user                            webuser;
worker_processes                auto;

events {
    worker_connections          1024;
}

http {
    include                     mime.types;
    include                     conf.d/*.conf;
    default_type                application/octet-stream;

    sendfile                    on;
    keepalive_timeout           65;

    # TLS settings (modern + secure)
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   off;
    ssl_session_timeout         1d;
    ssl_session_cache           shared:SSL:10m;
    ssl_session_tickets         off;

    # OCSP stapling (recommended)
    ssl_stapling                on;
    ssl_stapling_verify         on;

    # DNS resolver for OCSP
    resolver                    1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout            5s;

    # Blocking suspicious traffics
    map $http_user_agent $blocked_ua {
        default 0;
        ~*(curl|wget|python|libwww|httpclient|scrapy|go-http-client) 1;
    }
    map $query_string $blocked_query {
        default 0;
        ~*(\.\.|/etc/passwd|select.+from|union.+select) 1;
    }

    server {
        include                     conf.d/filters/scannerblock.conf; 
        
        listen                      80;
        server_name                 pearl-horizon.bonnybonnybonaktan.xyz;

        # Security headers
        add_header                  X-Frame-Options "SAMEORIGIN";
        add_header                  X-XSS-Protection "1; mode=block";
        add_header                  X-Content-Type-Options "nosniff";

        # Compression
        gzip                        on;
        gzip_types                  text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        root                        /app/www/frontend;

        location / {
            try_files               $uri $uri/ /index.html =404;
            expires                 -1;
        }
        location /api {
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_no_cache          1;
            proxy_cache_bypass      1;
            proxy_cache             off;
            proxy_pass              http://backend:8000/api;
        }
    }


}