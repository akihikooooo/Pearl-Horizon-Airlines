# Filtering commonly-scanned sensitive files
location ~* ^/(\.env|\.git|\.aws|\.docker|\.htaccess|\.htpasswd|var|s3) {
    return 444;
}
location ~* (docker-compose|package\.json|package-lock\.json|\.lock|\.yaml|composer\.json|\.yml|\.config|vercel\.json) {
    return 444;
}
location ~* (aws|credentials|config\.json|\.pem|\.key|id_rsa|env|\.toml|\.cgi) {
    return 444;
}
location ~ /\.(?!well-known) {
    deny all;
}

# Checking for blocked User-Agents and Queries (actual filter is in nginx.conf) 
if ($blocked_ua) {
    return 444;
}
if ($blocked_query) {
    return 444;
}
